<head>

<style>
  :root{--bg:#ffffff;--card:#fff;--ink:#2b2b2b;--muted:#8f8f8f;--accent:#464646;--accent-h:#3a3a3a;--accent2:#2b2b2b;--line:#efefef;--radius:4px}
  *{box-sizing:border-box;margin:0;padding:0}
  body{font-family:"Inter",-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--ink);min-height:100vh;display:flex;justify-content:center}
  .app{width:100%;max-width:440px;min-height:100vh;display:flex;flex-direction:column;position:relative;padding-bottom:76px}
  header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;border-bottom:1px solid var(--line)}
  .logo{display:flex;align-items:center}.logo img{height:30px;display:block}
  .logo b{display:inline-flex;width:30px;height:30px;border:2px solid var(--ink);align-items:center;justify-content:center;font-size:18px;font-weight:600}
  .langs{display:flex;gap:4px}
  .langs button{border:1px solid var(--line);background:transparent;border-radius:4px;padding:5px 9px;font-size:13px;color:var(--muted);cursor:pointer}
  .langs button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  main{padding:8px 20px;flex:1}
  h1{font-size:28px;font-weight:700;margin:14px 0 16px;letter-spacing:-.3px}
  h2{font-size:17px;margin:22px 0 10px}
  .card{background:var(--card);border-radius:var(--radius);padding:18px;border:1px solid var(--line);margin-bottom:14px}
  .points{background:var(--ink);color:#fff;border-color:var(--ink)}
  .points .big{font-size:44px;font-weight:700;line-height:1.1}
  .points .sub{opacity:.8;font-size:14px}
  .bar{height:8px;border-radius:4px;background:rgba(255,255,255,.25);margin:14px 0 6px;overflow:hidden}
  .bar i{display:block;height:100%;background:#fff;border-radius:4px}
  .qr{display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center}
  .qr .box{background:#fff;padding:10px;border-radius:12px}
  .muted{color:var(--muted);font-size:14px}
  .btn{display:block;width:100%;border:0;border-radius:4px;padding:14px;font-size:15px;font-weight:500;font-family:inherit;background:var(--accent);color:#fff;cursor:pointer}
  .btn:active{background:var(--accent-h)}
  .btn.ghost{background:transparent;color:var(--accent);border:1px solid var(--accent)}
  .btn.small{display:inline-block;width:auto;padding:9px 14px;font-size:14px}
  .btn:disabled{opacity:.4;cursor:default}
  input{width:100%;padding:14px;border-radius:4px;font-family:inherit;border:1px solid var(--line);font-size:17px;margin:8px 0 14px;background:#fff}
  .row{display:flex;justify-content:space-between;align-items:center;gap:12px}
  .pill{display:inline-block;font-size:12px;padding:3px 8px;border-radius:4px;background:#efefef;color:#464646}
  .event .date{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.4px}
  .event h3,.tea h3,.reward h3{font-size:17px;margin:4px 0}
  .tea .ru{font-size:13px;color:var(--muted)}
  nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);display:flex;padding:8px 0 calc(8px + env(safe-area-inset-bottom))}
  nav button{flex:1;border:0;background:transparent;font-size:11px;color:var(--muted);display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
  nav button .ic{font-size:21px}
  nav button.on{color:var(--accent);font-weight:600}
  .toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 16px;border-radius:4px;font-size:14px;opacity:0;transition:.25s;pointer-events:none;max-width:90%;text-align:center}
  .toast.show{opacity:1}
  .proto{font-size:11px;text-align:center;color:var(--muted);padding:6px 20px 0}
  .login{min-height:calc(100dvh - 200px);display:flex;flex-direction:column;justify-content:center;text-align:center;padding:0 6px}
  .login .mark{width:120px;margin:0 auto 26px;display:block}
  .login h1{font-size:22px;margin:0 0 8px}
  .login p{margin-bottom:22px}
  .login input{text-align:center;font-size:20px;letter-spacing:1px}
  body.out header .logo{visibility:hidden}
  .history div{display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid var(--line);font-size:14px}
  .history div:last-child{border:0}
  .media{margin:-18px -18px 14px;height:170px;overflow:hidden;border-radius:4px 4px 0 0;background:#f4f4f4}
  .media img{width:100%;height:100%;object-fit:cover;display:block}
  .tap{cursor:pointer}
  .more{font-size:13px;color:var(--accent);font-weight:600;margin-top:8px;display:inline-block}
  .desc{font-size:14px;line-height:1.5;color:#464646;margin:10px 0 4px;white-space:pre-line}
  .open .media{height:260px}
  .weights{display:flex;gap:6px;margin:12px 0 10px}
  .weights button{flex:1;border:1px solid var(--line);background:#fff;border-radius:4px;padding:8px 0;font-family:inherit;font-size:14px;color:var(--ink);cursor:pointer}
  .weights button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .side{display:flex;flex-direction:column;align-items:flex-end;gap:8px;flex-shrink:0;text-align:right}
  a.btn{text-align:center;text-decoration:none}
  .roles{display:flex;gap:4px;justify-content:center;padding:8px 20px 0}
  .roles button{border:1px dashed #c9c9c9;background:#fff;border-radius:4px;padding:4px 10px;font-size:12px;color:var(--muted);cursor:pointer;font-family:inherit}
  .roles button.on{border-style:solid;border-color:var(--ink);color:var(--ink);font-weight:600}
  .tiles{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:110px}
  .tile{position:relative;border:1px solid var(--line);border-radius:4px;padding:14px 12px;background:#fff;cursor:pointer;min-height:84px;display:flex;flex-direction:column;justify-content:space-between;user-select:none}
  .tile.sel{border-color:var(--ink);box-shadow:inset 0 0 0 1px var(--ink)}
  .tile b{font-size:15px;line-height:1.25}.tile span{font-size:13px;color:var(--muted)}
  .tile .q{position:absolute;top:-8px;right:-8px;background:var(--ink);color:#fff;border-radius:12px;min-width:24px;height:24px;font-size:13px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:0 6px}
  .tile .minus-b{position:absolute;bottom:8px;right:8px;border:1px solid var(--line);background:#fff;border-radius:4px;width:28px;height:28px;font-size:16px;cursor:pointer}
  .paybar{position:fixed;bottom:64px;left:50%;transform:translateX(-50%);width:100%;max-width:440px;background:#fff;border-top:1px solid var(--line);padding:10px 20px;display:flex;gap:12px;align-items:center}
  .paybar .sum{font-size:20px;font-weight:700;white-space:nowrap}
  .drow{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid var(--line)}
  .drow:last-child{border:0}.drow .acts{display:flex;gap:6px;flex-shrink:0}
  .form label{display:block;font-size:13px;color:var(--muted);margin-top:4px}
  .form input{margin:4px 0 10px;font-size:15px;padding:11px}
  .guest{display:flex;justify-content:space-between;align-items:center}
  .plus{color:#00a901;font-weight:600}.minus{color:#ab2e31;font-weight:600}
</style>
</head>

function setLang(l){S.lang=l;save();render()}
function nav(){const n=document.getElementById("nav");if(!S.phone){n.style.display="none";return}n.style.display="flex";
 const items=S.role=="guest"?[["home","☗"],["rewards","★"],["events","◷"],["teas","❦"]]:[["cashier","⌗"],["log","☰"]].concat(S.role=="admin"?[["menu","✎"]]:[]);
 n.innerHTML=items.map(([k,i])=>`<button class="${S.tab==k?"on":""}" onclick="go('${k}')"><span class="ic">${i}</span>${t(k)}</button>`).join("")}
function go(k){S.tab=k;save();render();window.scrollTo(0,0)}
function qrSVG(text){if(typeof qrcode==="undefined")return `<div class="muted">QR</div>`;const q=qrcode(0,"M");q.addData(text);q.make();return q.createSvgTag(5,0)}
function nextGoal(){const c=REWARDS.map(r=>r.cost).find(c=>c>S.points)||REWARDS[REWARDS.length-1].cost;return c}
const V={
 login(){
  const top=`<img class="mark" src="assets/logo-square.png" alt="t.element">`;
  if(S.step=="phone")return `<div class="login">${top}<h1>${t("welcome")}</h1><p class="muted">${t("login_hint")}</p>
   <input id="ph" type="tel" placeholder="+381 6x xxx xxxx" value="+381 ">
   <button class="btn" onclick="sendCode()">${t("get_code")}</button></div>`;
  return `<div class="login">${top}<h1>${t("code")}</h1><p class="muted">${t("code_hint")}</p>
   <input id="cd" inputmode="numeric" maxlength="4" placeholder="••••">
   <button class="btn" onclick="checkCode()">${t("enter")}</button></div>`},
 home(){const goal=nextGoal(),pct=Math.min(100,Math.round(S.points/goal*100));
  return `<h1>${t("hello")}!</h1>
  <div class="card points"><div class="sub">${t("your_points")}</div><div class="big">${S.points}</div>
   <div class="bar"><i style="width:${pct}%"></i></div><div class="sub">${t("to_next")}: ${Math.max(0,goal-S.points)} ${t("pts")}</div></div>
  <div class="card qr"><div class="box">${qrSVG("TELEMENT:"+S.phone)}</div><b>${t("show_qr")}</b><span class="muted">${t("qr_hint")}</span></div>
  <div class="card"><div class="muted" style="margin-bottom:10px">${t("sim")}</div><button class="btn ghost" onclick="buy()">${t("sim_btn")}</button></div>
  <p class="muted" style="text-align:center;margin:16px 0"><a href="#" onclick="logout();return false" style="color:var(--muted)">${t("logout")}</a></p>`},
 rewards(){return `<h1>${t("rewards")}: ${S.points}</h1><p class="muted" style="margin-bottom:14px">${t("rule")}</p>`+
  REWARDS.map(r=>`<div class="card reward row"><div><h3>${L(r.name)}</h3><span class="pill">${r.cost} ${t("pts")}</span></div>
   <button class="btn small" ${S.points<r.cost?"disabled":""} onclick="redeem('${r.id}')">${S.points<r.cost?t("not_enough"):t("redeem")}</button></div>`).join("")+
  `<h2>${t("history")}</h2><div class="card history">${S.history.slice().reverse().map(h=>`<div><span>${h.d} · ${t(h.k)}</span><span class="${h.v>0?"plus":"minus"}">${h.v>0?"+":""}${h.v}</span></div>`).join("")}</div>`},
 events(){return `<h1>${t("events")}</h1>`+EVENTS.map(e=>{const mine=!!S.booked[e.id],taken=e.taken+(mine?1:0),left=e.seats-taken,o=!!OPEN[e.id];
  return `<div class="card event ${o?"open":""}"><div class="tap" onclick="tog('${e.id}')"><div class="media"><img src="${e.img}" alt=""></div>
   <div class="date">${L(e.date)}</div><h3>${L(e.title)}</h3>
   ${o?`<div class="desc">${L(e.desc)}</div>`:""}<span class="more">${o?t("less")+" ▴":t("more")+" ▾"}</span></div>
   <div class="row" style="margin:8px 0 12px"><span class="muted">${t("seats_left")}: ${left} ${t("of")} ${e.seats}</span><span class="pill">${e.price} · ${t("pay_cash")}</span></div>
   ${mine?`<div class="row"><b style="color:var(--ink)">✓ ${t("signed")}</b><button class="btn small ghost" onclick="book('${e.id}',false)">${t("cancel")}</button></div>`
     :`<button class="btn" ${left<=0?"disabled":""} onclick="book('${e.id}',true)">${left<=0?t("full"):t("signup")}</button>`}</div>`}).join("")},
 teas(){return `<h1>${t("new_in")}</h1>`+TEAS.map(x=>{const o=!!OPEN[x.id],si=SEL[x.id]||0,v=x.vars[si],href=SHOP+v[1];
   const btn=cls=>`<a class="btn ${cls}" href="${href}" target="_blank" rel="noopener" onclick="event.stopPropagation()">${t("order")}</a>`;
   return `<div class="card tea tap ${o?"open":""}" onclick="tog('${x.id}')"><div class="media"><img src="${x.img}" alt=""></div>
   <div class="row" style="align-items:flex-start"><div><span class="pill">${L(x.type)}</span><h3>${x.name}</h3><div class="ru">${x.ru}</div></div>
    <div class="side"><span class="muted">${v[2]} din / ${v[0]} ${t("g")}</span>${o?"":btn("small")}</div></div>
   ${o?`<div class="desc">${L(x.desc)}</div>
   <div class="weights">${x.vars.map((w,i)=>`<button class="${i==si?"on":""}" onclick="pick(event,'${x.id}',${i})">${w[0]} ${t("g")} · ${w[2]}</button>`).join("")}</div>
   ${btn("")}`:""}<span class="more">${o?t("less")+" ▴":t("more")+" ▾"}</span></div>`}).join("")+
  `<button class="btn ${S.notify?"ghost":""}" onclick="toggleNotify()">${S.notify?"✓ "+t("notify_on"):t("notify")}</button>`}
};

Object.assign(T.sr,{r_guest:"Gost",r_cashier:"Kasir",r_admin:"Admin",cashier:"Kasa",menu:"Meni",log:"Dnevnik",
 scan:"Skeniraj QR gosta",scan_hint:"U prototipu je skener simuliran: pritisnite dugme.",guest_lbl:"Gost",balance:"stanje",
 pick:"Izaberite pića",confirm:"Dodaj bodove",nothing:"Izaberite bar jedno piće",accrued:"Dodato",cancel_g:"Drugi gost",

Object.assign(T.en,{r_guest:"Guest",r_cashier:"Cashier",r_admin:"Admin",cashier:"Till",menu:"Menu",log:"Log",
 scan:"Scan guest QR",scan_hint:"The scanner is simulated in the prototype: tap the button.",guest_lbl:"Guest",balance:"balance",
 pick:"Pick drinks",confirm:"Add points",nothing:"Pick at least one drink",accrued:"Added",cancel_g:"Another guest",
 add_drink:"Add drink",edit:"Edit",del:"Delete",save:"Save",cancel_e:"Cancel",restore:"Restore",hidden:"Hidden drinks",
 n_ru:"Name (Russian)",n_sr:"Name (Serbian)",n_en:"Name (English)",points_lbl:"Points per drink",del_q:"Remove this drink from the menu? It stays in the log.",
 need_name:"Fill in the name and points",saved:"Saved",empty_log:"No points added yet",cashier_name:"Evgeniy",menu_hint:"A deleted drink disappears from the till but stays in the log."});
const DEF_DRINKS=[
 {id:"d1",pts:15,name:{ru:"Чай в чайнике",sr:"Čaj u čajniku",en:"Pot of tea"}},
 {id:"d2",pts:25,name:{ru:"Гунфу ча",sr:"Gongfu ča",en:"Gongfu cha"}},
 {id:"d3",pts:15,name:{ru:"Пуэр в чайнике",sr:"Puer u čajniku",en:"Pot of puer"}},
 {id:"d4",pts:15,name:{ru:"Матча латте",sr:"Matcha latte",en:"Matcha latte"}},
 {id:"d5",pts:10,name:{ru:"Матча классическая",sr:"Klasična matcha",en:"Classic matcha"}},
 {id:"d6",pts:40,name:{ru:"Церемония на двоих",sr:"Ceremonija za dvoje",en:"Ceremony for two"}}
];
if(!S.drinks)S.drinks=DEF_DRINKS.map(d=>({...d,active:true}));
if(!S.log)S.log=[];
if(!S.role)S.role="guest";
let CART={},SCANNED=false,EDIT=null;
const esc=x=>String(x).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const DN=d=>esc(d.name[S.lang]||d.name.ru);
const cartPts=()=>Object.entries(CART).reduce((a,[id,q])=>a+q*(S.drinks.find(d=>d.id==id)||{pts:0}).pts,0);
function setRole(r){S.role=r;S.tab=r=="guest"?"home":"cashier";CART={};SCANNED=false;EDIT=null;save();render();window.scrollTo(0,0)}
function roles(){const e=document.getElementById("roles");if(!S.phone){e.innerHTML="";return}
 e.innerHTML=["guest","cashier","admin"].map(r=>`<button class="${S.role==r?"on":""}" onclick="setRole('${r}')">${t("r_"+r)}</button>`).join("")}
function scanQR(){SCANNED=true;CART={};render()}
function addD(id,n){CART[id]=Math.max(0,(CART[id]||0)+n);if(!CART[id])delete CART[id];render()}
function accrue(){const p=cartPts();if(!p){toast(t("nothing"));return}
 S.points+=p;S.history.push({k:"purchase",v:p,d:today()});
 S.log.push({d:today()+" "+new Date().toTimeString().slice(0,5),who:t("cashier_name"),guest:S.phone,items:Object.entries(CART),pts:p});
 CART={};SCANNED=false;save();render();toast(t("accrued")+": +"+p+" "+t("pts"))}
function editD(id){EDIT=id;render();window.scrollTo(0,0)}
function saveD(){const g=k=>document.getElementById(k).value.trim();const ru=g("f_ru"),pts=parseInt(g("f_pts"),10);
 if(!ru||!(pts>0)){toast(t("need_name"));return}
 const name={ru,sr:g("f_sr")||ru,en:g("f_en")||ru};
 if(EDIT=="new")S.drinks.push({id:"d"+Date.now(),pts,name,active:true});else Object.assign(S.drinks.find(d=>d.id==EDIT),{pts,name});
 EDIT=null;save();render();toast(t("saved"))}
function delD(id){if(!confirm(t("del_q")))return;S.drinks.find(d=>d.id==id).active=false;save();render()}
function restD(id){S.drinks.find(d=>d.id==id).active=true;save();render()}
Object.assign(V,{
 cashier(){
  if(!SCANNED)return `<h1>${t("cashier")}</h1><div class="card qr"><div style="font-size:54px;line-height:1">⌗</div><button class="btn" onclick="scanQR()">${t("scan")}</button><span class="muted">${t("scan_hint")}</span></div>`;
  const p=cartPts();
  return `<h1>${t("cashier")}</h1>
  <div class="card guest"><div><div class="muted">${t("guest_lbl")}</div><b>${esc(S.phone)}</b></div><div style="text-align:right"><div class="muted">${t("balance")}</div><b>${S.points} ${t("pts")}</b></div></div>
  <h2>${t("pick")}</h2>
  <div class="tiles">${S.drinks.filter(d=>d.active).map(d=>{const q=CART[d.id]||0;return `<div class="tile ${q?"sel":""}" onclick="addD('${d.id}',1)">
   ${q?`<div class="q">×${q}</div>`:""}<b>${DN(d)}</b><span>+${d.pts}</span>${q?`<button class="minus-b" onclick="event.stopPropagation();addD('${d.id}',-1)">−</button>`:""}</div>`}).join("")}</div>
  <div class="paybar"><div class="sum">+${p}</div><button class="btn" ${p?"":"disabled"} onclick="accrue()">${t("confirm")}</button></div>
  <p class="muted" style="text-align:center;margin:-90px 0 110px"><a href="#" onclick="SCANNED=false;CART={};render();return false" style="color:var(--muted)">${t("cancel_g")}</a></p>`},
 menu(){
  if(EDIT){const d=EDIT=="new"?{pts:"",name:{ru:"",sr:"",en:""}}:S.drinks.find(x=>x.id==EDIT);
   return `<h1>${EDIT=="new"?t("add_drink"):t("edit")}</h1><div class="card form">
    <label>${t("n_ru")}</label><input id="f_ru" value="${esc(d.name.ru)}">
    <label>${t("n_sr")}</label><input id="f_sr" value="${esc(d.name.sr)}">
    <label>${t("n_en")}</label><input id="f_en" value="${esc(d.name.en)}">
    <label>${t("points_lbl")}</label><input id="f_pts" type="number" inputmode="numeric" min="1" value="${d.pts}">
    <button class="btn" onclick="saveD()">${t("save")}</button><button class="btn ghost" style="margin-top:8px" onclick="EDIT=null;render()">${t("cancel_e")}</button></div>`}
  const act=S.drinks.filter(d=>d.active),hid=S.drinks.filter(d=>!d.active);
  return `<h1>${t("menu")}</h1><button class="btn" style="margin-bottom:14px" onclick="editD('new')">+ ${t("add_drink")}</button>
  <div class="card">${act.map(d=>`<div class="drow"><div><b>${DN(d)}</b><div class="muted">+${d.pts} ${t("pts")}</div></div>
   <div class="acts"><button class="btn small ghost" onclick="editD('${d.id}')">${t("edit")}</button><button class="btn small ghost" onclick="delD('${d.id}')">${t("del")}</button></div></div>`).join("")}</div>
  <p class="muted" style="margin-bottom:14px">${t("menu_hint")}</p>
  ${hid.length?`<h2>${t("hidden")}</h2><div class="card">${hid.map(d=>`<div class="drow"><div class="muted">${DN(d)} · +${d.pts}</div><button class="btn small ghost" onclick="restD('${d.id}')">${t("restore")}</button></div>`).join("")}</div>`:""}`},
 log(){return `<h1>${t("log")}</h1>`+(S.log.length?`<div class="card history">${S.log.slice().reverse().map(l=>`<div><span>${esc(l.d)} · ${esc(l.who)}<br><span class="muted">${l.items.map(([id,q])=>{const d=S.drinks.find(x=>x.id==id);return (d?DN(d):"?")+(q>1?" ×"+q:"")}).join(", ")}</span></span><span class="plus">+${l.pts}</span></div>`).join("")}</div>`:`<p class="muted">${t("empty_log")}</p>`)}
});
function sendCode(){const v=document.getElementById("ph").value.replace(/\s/g,"");if(v.length<9){toast(t("phone"));return}S.pending=v;S.step="code";save();render()}
function checkCode(){const v=document.getElementById("cd").value;if(!/^\d{4}$/.test(v)){toast(t("code_hint"));return}S.phone=S.pending;S.step="phone";S.tab="home";save();render()}
function logout(){S.phone=null;save();render()}
function today(){const d=new Date();return String(d.getDate()).padStart(2,"0")+"."+String(d.getMonth()+1).padStart(2,"0")}
function buy(){S.points+=35;S.history.push({k:"purchase",v:35,d:today()});save();render();toast(t("earned")+": +35 "+t("pts"))}
function redeem(id){const r=REWARDS.find(x=>x.id==id);if(S.points<r.cost)return;S.points-=r.cost;S.history.push({k:"reward",v:-r.cost,d:today()});save();render();toast(t("redeemed")+": "+L(r.name))}
function book(id,on){if(on)S.booked[id]=true;else delete S.booked[id];save();render();toast(on?t("signed_ok"):t("cancel_ok"))}
function toggleNotify(){S.notify=!S.notify;save();render()}
function render(){document.body.classList.toggle("out",!S.phone);langs();roles();if(S.phone&&S.role=="guest"&&!["home","rewards","events","teas"].includes(S.tab))S.tab="home";if(S.phone&&S.role!="guest"&&!["cashier","log","menu"].includes(S.tab))S.tab="cashier";if(S.role=="cashier"&&S.tab=="menu")S.tab="cashier";document.getElementById("view").innerHTML=S.phone?V[S.tab]():V.login();nav()}
render();
</script>
